<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2f6b3c" />
  <title>Forest Plot Recorder</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="leaf" aria-hidden="true">🌲</span>
      <div>
        <h1>Forest Plot Recorder</h1>
        <p class="tagline">Field data for small forest plots</p>
      </div>
    </div>
    <div class="header-actions">
      <button id="exportCsvBtn" class="btn btn-light" type="button">Export plot (CSV)</button>
      <button id="exportJsonBtn" class="btn btn-light" type="button">Export plot (JSON)</button>
      <button id="importBtn" class="btn btn-light" type="button">Import</button>
      <input id="importFile" type="file" accept=".json,application/json" hidden />
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button id="tabPlot" class="tab is-active" type="button" role="tab" aria-selected="true" aria-controls="plotsPanel">
      📋 Plot
    </button>
    <button id="tabTrees" class="tab" type="button" role="tab" aria-selected="false" aria-controls="treesPanel">
      🌳 Trees <span id="tabTreesCount" class="tab-badge" hidden>0</span>
    </button>
  </nav>

  <main class="layout">
    <!-- ============ PLOTS COLUMN ============ -->
    <section id="plotsPanel" class="panel is-active" role="tabpanel" aria-labelledby="plotsHeading">
      <div class="panel-head">
        <h2 id="plotsHeading">Plots</h2>
        <span id="plotCount" class="pill">0</span>
      </div>

      <form id="plotForm" class="form" autocomplete="off">
        <input type="hidden" id="plotId" />
        <div class="grid-2">
          <label class="field">
            <span>Plot number <em>*</em></span>
            <select id="plotNumber" required>
              <option value="">Select 1–50</option>
            </select>
          </label>
          <label class="field">
            <span>Date <em>*</em></span>
            <input id="plotDate" type="date" required />
          </label>
        </div>

        <div class="grid-2">
          <label class="field">
            <span>Plot name / ID</span>
            <input id="plotName" type="text" placeholder="e.g. North Ridge" />
          </label>
          <label class="field">
            <span>Surveyor</span>
            <input id="plotSurveyor" type="text" placeholder="Recorder name" />
          </label>
        </div>

        <div class="grid-2">
          <label class="field">
            <span>Latitude</span>
            <input id="plotLat" type="number" step="any" placeholder="-37.81234" />
          </label>
          <label class="field">
            <span>Longitude</span>
            <input id="plotLng" type="number" step="any" placeholder="144.96321" />
          </label>
        </div>
        <button id="gpsBtn" class="btn btn-ghost btn-block" type="button">📍 Use my current location</button>

        <div class="grid-2">
          <label class="field">
            <span>Plot shape</span>
            <select id="plotShape">
              <option value="circular">Circular</option>
              <option value="square">Square</option>
              <option value="rectangular">Rectangular</option>
              <option value="transect">Transect</option>
            </select>
          </label>
          <label class="field">
            <span>Size (m² or radius m)</span>
            <input id="plotSize" type="number" step="any" placeholder="e.g. 100" />
          </label>
        </div>

        <div class="grid-2">
          <label class="field">
            <span>Slope (°)</span>
            <input id="plotSlope" type="number" step="any" placeholder="0–90" />
          </label>
          <label class="field">
            <span>Aspect</span>
            <select id="plotAspect">
              <option value="">—</option>
              <option>N</option><option>NE</option><option>E</option><option>SE</option>
              <option>S</option><option>SW</option><option>W</option><option>NW</option>
            </select>
          </label>
        </div>

        <div class="grid-2">
          <label class="field">
            <span>Canopy cover (%)</span>
            <input id="plotCanopy" type="number" step="any" min="0" max="100" placeholder="0–100" />
          </label>
          <label class="field">
            <span>Number of gaps</span>
            <input id="plotGaps" type="number" step="1" min="0" placeholder="Canopy gaps" />
          </label>
        </div>

        <fieldset class="subgroup">
          <legend>Soil &amp; site</legend>
          <div class="grid-2">
            <label class="field">
              <span>Soil texture</span>
              <select id="plotSoilTexture">
                <option value="">—</option>
                <option>Sand</option>
                <option>Loamy sand</option>
                <option>Sandy loam</option>
                <option>Loam</option>
                <option>Silt loam</option>
                <option>Silt</option>
                <option>Clay loam</option>
                <option>Silty clay</option>
                <option>Clay</option>
                <option>Peat</option>
              </select>
            </label>
            <label class="field">
              <span>Soil colour</span>
              <input id="plotSoilColour" type="text" placeholder="e.g. dark brown / 10YR 3/2" />
            </label>
          </div>
          <div class="grid-2">
            <label class="field">
              <span>Litter depth (cm)</span>
              <input id="plotLitterDepth" type="number" step="any" min="0" placeholder="0–…" />
            </label>
            <label class="field">
              <span>Drainage</span>
              <select id="plotDrainage">
                <option value="">—</option>
                <option>Very poor</option>
                <option>Poor</option>
                <option>Imperfect</option>
                <option>Moderate</option>
                <option>Well drained</option>
                <option>Excessive</option>
              </select>
            </label>
          </div>
          <label class="field">
            <span>Disturbance level</span>
            <select id="plotDisturbance">
              <option value="">—</option>
              <option>None</option>
              <option>Low</option>
              <option>Moderate</option>
              <option>High</option>
              <option>Severe</option>
            </select>
          </label>
        </fieldset>

        <label class="field">
          <span>Notes</span>
          <textarea id="plotNotes" rows="2" placeholder="Habitat, access, other observations…"></textarea>
        </label>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save plot</button>
          <button id="plotCancelBtn" type="button" class="btn btn-ghost" hidden>Cancel</button>
        </div>
      </form>

      <ul id="plotList" class="plot-list"></ul>
    </section>

    <!-- ============ TREES COLUMN ============ -->
    <section id="treesPanel" class="panel" role="tabpanel" aria-labelledby="treesHeading">
      <div class="panel-head">
        <h2 id="treesHeading">Trees</h2>
        <span id="treeContext" class="muted">Select a plot</span>
      </div>

      <form id="treeForm" class="form" autocomplete="off" hidden>
        <input type="hidden" id="treeId" />
        <div class="grid-2">
          <label class="field">
            <span>Running number <em>*</em></span>
            <input id="treeRunning" type="number" step="1" min="1" required placeholder="e.g. 1" />
          </label>
          <label class="field">
            <span>Species (local name) <em>*</em></span>
            <input id="treeSpeciesLocal" type="text" required placeholder="Local name" list="speciesLocalList" />
            <datalist id="speciesLocalList"></datalist>
          </label>
        </div>

        <div class="grid-2">
          <label class="field">
            <span>Species ID</span>
            <input id="treeSpeciesId" type="text" placeholder="Code / scientific" list="speciesIdList" />
            <datalist id="speciesIdList"></datalist>
          </label>
          <label class="field">
            <span>DBH (cm)</span>
            <input id="treeDbh" type="number" step="any" placeholder="Diameter at breast height" />
          </label>
        </div>

        <fieldset class="subgroup">
          <legend>Height — clinometer</legend>
          <div class="grid-3">
            <label class="field">
              <span>Distance to tree (m)</span>
              <input id="treeDistance" type="number" step="any" placeholder="Horizontal" />
            </label>
            <label class="field">
              <span>Angle to base (°)</span>
              <input id="treeAngleBase" type="number" step="any" placeholder="Down = −" />
            </label>
            <label class="field">
              <span>Angle to top (°)</span>
              <input id="treeAngleTop" type="number" step="any" placeholder="Up = +" />
            </label>
          </div>
          <div class="calc-row">
            <span class="calc-label">Calculated height</span>
            <span id="treeHeightCalc" class="calc-value">—</span>
            <span class="muted">m</span>
          </div>
        </fieldset>

        <div class="grid-2">
          <label class="field">
            <span>Canopy diameter X (m)</span>
            <input id="treeCanopyX" type="number" step="any" placeholder="Widest axis" />
          </label>
          <label class="field">
            <span>Canopy diameter Y (m)</span>
            <input id="treeCanopyY" type="number" step="any" placeholder="Perpendicular axis" />
          </label>
        </div>

        <div class="grid-2">
          <label class="field">
            <span>Crown class</span>
            <select id="treeCrownClass">
              <option value="">—</option>
              <option>Emergent</option>
              <option>Dominant</option>
              <option>Co-dominant</option>
              <option>Intermediate</option>
              <option>Suppressed</option>
            </select>
          </label>
          <label class="field">
            <span>Health status</span>
            <select id="treeHealth">
              <option value="">—</option>
              <option>Healthy</option>
              <option>Stressed</option>
              <option>Declining</option>
              <option>Dead (standing)</option>
              <option>Dead (fallen)</option>
            </select>
          </label>
        </div>

        <label class="field">
          <span>Notes</span>
          <textarea id="treeNotes" rows="2" placeholder="Form, damage, epiphytes…"></textarea>
        </label>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Add tree</button>
          <button id="treeCancelBtn" type="button" class="btn btn-ghost" hidden>Cancel</button>
        </div>
      </form>

      <div id="treeEmpty" class="empty">
        <p>Select or create a plot to start recording trees.</p>
      </div>

      <div class="table-wrap">
        <table id="treeTable" class="data-table" hidden>
          <thead>
            <tr>
              <th>#</th>
              <th>Species</th>
              <th>DBH (cm)</th>
              <th>Height (m)</th>
              <th>Crown</th>
              <th>Health</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="treeBody"></tbody>
        </table>
      </div>

      <div id="plotStats" class="stats" hidden></div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
</body>
</html>
